org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# §53: works around the recurring "java.io.IOException: Unable to establish loopback
# connection" failure hit across many build attempts on this project (this session and
# earlier ones, per PROJECT_STATUS.md). That error is Gradle's own persistent background
# daemon process failing to open a local TCP loopback (127.0.0.1) socket back to the launching
# process -- it is NOT a network/internet problem, and NOT related to this project's code.
# It is well documented upstream as happening when something on the machine intercepts or
# blocks local loopback connections specifically for Java processes -- most commonly a VPN
# client, a corporate/antivirus firewall doing TLS inspection, or (on some Windows setups) an
# IPv6-vs-IPv4 localhost resolution mismatch. Disabling the daemon makes each Gradle invocation
# run in a single, self-contained process with no persistent background daemon and therefore no
# loopback IPC channel to fail -- this is the standard, well-known fix/workaround for exactly
# this error message. Builds will be a little slower (no warm daemon reused between runs), which
# is a fully acceptable trade if it actually unblocks building at all. If this alone does not
# fix it, the other usual causes (in rough order of likelihood) are: a VPN or corporate network
# client actively running during the build (try pausing/disconnecting it for one build attempt);
# antivirus real-time protection or a firewall rule blocking java.exe/javaw.exe from binding to
# 127.0.0.1 (check its logs for a blocked-connection entry around the same timestamp as the
# failed build, and add an exception for the JDK's java.exe if found); and, less commonly, a
# hosts file or IPv6 misconfiguration that makes "localhost" resolve somewhere Gradle does not
# expect (try adding -Djava.net.preferIPv4Stack=true to org.gradle.jvmargs above as a next step).
org.gradle.daemon=false
